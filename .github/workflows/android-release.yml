name: Android Release (AAB + Play Store)

# Workflow consolidé:
#  1) Build web (Vite) + sync Capacitor
#  2) Signature release via secrets dédiés
#  3) Génération de l'AAB (et APK universel pour test)
#  4) Publication en artifacts GitHub
#  5) Création d'une GitHub Release sur tag vX.Y.Z
#  6) Upload optionnel vers Google Play (track configurable + rollout)
#
# Secrets requis pour la signature:
#   ANDROID_KEYSTORE              (base64 du .jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Secret optionnel pour upload Google Play:
#   PLAY_SERVICE_ACCOUNT_JSON     (JSON du service account)
#
# Secret optionnel de vérification:
#   EXPECTED_UPLOAD_SHA1          (SHA-1 attendu de la clé d'upload Play)

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish_play:
        description: 'Publier vers Google Play après le build'
        type: boolean
        required: false
        default: false
      track:
        description: 'Track Google Play (si publish_play=true)'
        type: choice
        required: false
        default: internal
        options: [internal, alpha, beta, production]
      rollout:
        description: 'Rollout fraction pour production (0-1). Vide = 100%.'
        required: false
        default: '0.2'

env:
  PACKAGE_NAME: app.lovable.afrikoin

jobs:
  build-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    outputs:
      aab_path: ${{ steps.locate.outputs.aab_path }}
      apk_path: ${{ steps.locate.outputs.apk_path }}
      mapping_path: ${{ steps.locate.outputs.mapping_path }}
      version_name: ${{ steps.locate.outputs.version_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode keystore from secret
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "❌ Secret ANDROID_KEYSTORE manquant (base64 du .jks)" >&2
            exit 1
          fi
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore

      - name: Configure signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "MYAPP_UPLOAD_STORE_FILE=release.keystore"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties

      - name: Verify keystore SHA-1
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED: ${{ secrets.EXPECTED_UPLOAD_SHA1 }}
        run: |
          set -e
          RAW=$(keytool -list -v -alias "$KEY_ALIAS" \
            -keystore android/app/release.keystore \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD")
          FP=$(printf "%s" "$RAW" | sed -n 's/.*SHA1:\s*\(.*\)/\1/p' | head -n1 | tr '[:lower:]' '[:upper:]' | tr -d ' :')
          echo "SHA-1 keystore: $FP"
          if [ -n "$EXPECTED" ]; then
            EXP=$(echo "$EXPECTED" | tr '[:lower:]' '[:upper:]' | tr -d ' :')
            if [ "$FP" != "$EXP" ]; then
              echo "❌ SHA-1 ne correspond pas à EXPECTED_UPLOAD_SHA1 ($EXP)"
              exit 1
            fi
            echo "✅ SHA-1 conforme."
          fi

      - name: Print signing config
        working-directory: android
        run: ./gradlew :app:printSigningConfig --no-daemon

      - name: Build AAB (release)
        working-directory: android
        run: ./gradlew :app:clean :app:bundleRelease --no-daemon --stacktrace

      - name: Build universal APK (debug install/test)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Locate build outputs
        id: locate
        run: |
          AAB=$(find android/app/build/outputs/bundle -name "*.aab" | head -n1)
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n1 || true)
          MAP=$(find android/app/build/outputs/mapping -name "mapping.txt" | head -n1 || true)
          echo "aab_path=$AAB" >> $GITHUB_OUTPUT
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "mapping_path=$MAP" >> $GITHUB_OUTPUT
          VN="${GITHUB_REF_NAME#v}"
          echo "version_name=$VN" >> $GITHUB_OUTPUT
          echo "📦 AAB: $AAB"
          echo "📦 APK: $APK"
          echo "🗺️  mapping: $MAP"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK artifact
        if: steps.locate.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ProGuard mapping
        if: steps.locate.outputs.mapping_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

  changelog:
    name: Generate release notes
    runs-on: ubuntu-latest
    outputs:
      prev_tag: ${{ steps.notes.outputs.prev_tag }}
      curr_tag: ${{ steps.notes.outputs.curr_tag }}
      has_breaking: ${{ steps.notes.outputs.has_breaking }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve compare range
        id: range
        run: |
          set -e
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            CURR_TAG="${GITHUB_REF_NAME}"
          else
            CURR_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi
          if [ -n "$CURR_TAG" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 "${CURR_TAG}^" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..${CURR_TAG}"
            else
              RANGE="${CURR_TAG}"
            fi
            REF_LABEL="$CURR_TAG"
          else
            # Pas encore de tag (build manuel/branche): prendre les 50 derniers commits
            PREV_TAG=""
            CURR_TAG=""
            RANGE="-n 50"
            REF_LABEL="${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
          fi
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "curr_tag=$CURR_TAG" >> $GITHUB_OUTPUT
          echo "range=$RANGE" >> $GITHUB_OUTPUT
          echo "ref_label=$REF_LABEL" >> $GITHUB_OUTPUT
          echo "📝 Range: $RANGE | Label: $REF_LABEL"

      - name: Dump commits (NUL-separated, full body)
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          # Format: HASH \x1f SUBJECT \x1f AUTHOR \x1f BODY \x00
          git log --no-merges \
            --pretty=format:'%H%x1f%s%x1f%an%x1f%b%x00' \
            $RANGE > commits.bin || true
          echo "Bytes: $(wc -c < commits.bin)"

      - name: Generate notes (AAB + APK) with categorization
        id: notes
        env:
          PREV_TAG: ${{ steps.range.outputs.prev_tag }}
          CURR_TAG: ${{ steps.range.outputs.curr_tag }}
          REF_LABEL: ${{ steps.range.outputs.ref_label }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p release-notes/whatsnew
          python3 <<'PY'
          import os, re, pathlib

          raw = pathlib.Path("commits.bin").read_bytes().decode("utf-8", "replace")
          entries = [e for e in raw.split("\x00") if e.strip()]

          # Conventional Commits — couvre feat, fix, perf, refactor, docs,
          # chore, build, ci, style, test, revert + scope optionnel + "!" breaking.
          CC_RE = re.compile(
              r'^(?P<type>feat|fix|perf|refactor|docs|chore|build|ci|style|test|revert)'
              r'(?:\((?P<scope>[^)]+)\))?'
              r'(?P<bang>!)?:\s*(?P<desc>.+)$'
          )
          BREAKING_BODY_RE = re.compile(r'^BREAKING[ -]CHANGE:\s*(.+)', re.MULTILINE)

          CATEGORIES = [
              ("breaking", "💥 Changements cassants (BREAKING)"),
              ("feat",     "✨ Nouveautés"),
              ("fix",      "🐛 Corrections"),
              ("perf",     "⚡ Performance"),
              ("refactor", "♻️ Refactor"),
              ("docs",     "📚 Documentation"),
              ("revert",   "⏪ Reverts"),
              ("chore",    "🔧 Maintenance"),
              ("build",    "🔧 Maintenance"),
              ("ci",       "🔧 Maintenance"),
              ("style",    "🔧 Maintenance"),
              ("test",     "🔧 Maintenance"),
              ("other",    "📦 Autres changements"),
          ]
          buckets = {key: [] for key, _ in CATEGORIES}
          breaking_notes = []  # textes BREAKING CHANGE: ... extraits du body

          for e in entries:
              parts = e.split("\x1f")
              if len(parts) < 4:
                  continue
              h, subject, author, body = parts[0], parts[1], parts[2], parts[3]
              h = h.strip()
              subject = subject.strip()
              body = body.strip()
              short = h[:7]

              m = CC_RE.match(subject)
              if m:
                  ctype = m.group("type")
                  scope = m.group("scope")
                  bang  = bool(m.group("bang"))
                  desc  = m.group("desc").strip()
                  scope_str = f"**{scope}**: " if scope else ""
                  line = f"- {scope_str}{desc} ([`{short}`]({os.environ['REPO_URL']}/commit/{h}))"

                  is_breaking = bang or BREAKING_BODY_RE.search(body) is not None
                  if is_breaking:
                      buckets["breaking"].append(line)
                      for bm in BREAKING_BODY_RE.finditer(body):
                          # Premier paragraphe seulement (multi-ligne propre)
                          first_para = bm.group(1).strip().split("\n\n")[0].replace("\n", " ").strip()
                          breaking_notes.append(f"  - _{first_para}_")
                  else:
                      buckets[ctype].append(line)
              else:
                  # Sujet non conventional: on garde la 1ère ligne uniquement
                  first_line = subject.splitlines()[0] if subject else "(sans sujet)"
                  buckets["other"].append(
                      f"- {first_line} ([`{short}`]({os.environ['REPO_URL']}/commit/{h}))"
                  )

          prev_tag   = os.environ.get("PREV_TAG", "")
          curr_tag   = os.environ.get("CURR_TAG", "")
          ref_label  = os.environ.get("REF_LABEL", "")
          repo_url   = os.environ["REPO_URL"]
          run_number = os.environ.get("RUN_NUMBER", "")
          sha        = os.environ.get("COMMIT_SHA", "")

          title = f"AfriKoin {curr_tag or ref_label}"
          compare_line = ""
          if prev_tag and curr_tag:
              compare_line = f"**Compare:** [`{prev_tag}...{curr_tag}`]({repo_url}/compare/{prev_tag}...{curr_tag})"
          elif curr_tag:
              compare_line = "**Première release**"
          else:
              compare_line = f"_Build manuel sur `{ref_label}` (50 derniers commits)._"

          def render(header_extra=""):
              out = [f"## {title}", ""]
              if compare_line:
                  out.append(compare_line)
                  out.append("")
              out.extend([
                  f"- Build: #{run_number}",
                  f"- Commit: `{sha[:7]}`",
              ])
              if header_extra:
                  out.append("")
                  out.append(header_extra)
              out.append("")

              seen_titles = set()
              for key, label in CATEGORIES:
                  lines = buckets[key]
                  if not lines:
                      continue
                  # Fusionne maintenance (chore/build/ci/style/test) sous un seul titre
                  if label in seen_titles:
                      out.extend(lines)
                      continue
                  seen_titles.add(label)
                  out.append(f"### {label}")
                  out.extend(lines)
                  if key == "breaking" and breaking_notes:
                      out.extend(breaking_notes)
                  out.append("")
              return "\n".join(out).rstrip() + "\n"

          # AAB: notes complètes, orientation Play Store
          aab_notes = render("📦 **Artifact:** Android App Bundle (AAB) — Google Play Store")
          # APK: notes + section installation manuelle
          apk_extra = (
              "📦 **Artifact:** Universal APK — installation manuelle / sideload\n\n"
              "> ⚠️ Cet APK est signé avec la clé d'upload. Pour tests internes "
              "uniquement — préférez l'AAB pour la distribution Play Store."
          )
          apk_notes = render(apk_extra)

          pathlib.Path("release-notes/RELEASE_NOTES.md").write_text(aab_notes, encoding="utf-8")
          pathlib.Path("release-notes/RELEASE_NOTES_APK.md").write_text(apk_notes, encoding="utf-8")

          # Play Store whatsnew (max 500 chars). Inclut breaking + feat + fix.
          play_lines = [title, ""]
          for key in ("breaking", "feat", "fix"):
              for line in buckets[key]:
                  # Reformatte: "- desc (hash)" -> "• desc"
                  m = re.match(r'-\s+(?:\*\*[^*]+\*\*:\s*)?(.+?)\s+\(\[`', line)
                  if m:
                      prefix = "⚠ " if key == "breaking" else ("• " if key == "feat" else "✓ ")
                      play_lines.append(prefix + m.group(1))
          play_text = "\n".join(play_lines)[:480]

          for locale in ("fr-FR", "en-US"):
              pathlib.Path(f"release-notes/whatsnew/whatsnew-{locale}").write_text(play_text, encoding="utf-8")

          # Outputs GitHub Actions
          has_breaking = "true" if buckets["breaking"] else "false"
          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as f:
                  f.write(f"prev_tag={prev_tag}\n")
                  f.write(f"curr_tag={curr_tag}\n")
                  f.write(f"has_breaking={has_breaking}\n")

          print("----- RELEASE_NOTES.md -----")
          print(aab_notes)
          print("----- whatsnew-fr-FR -----")
          print(play_text)
          PY

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes/
          retention-days: 30

  github-release:
    name: GitHub Release (on tag)
    needs: [build-aab, changelog]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: dist/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: dist/
        continue-on-error: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: AfriKoin ${{ github.ref_name }}
          files: |
            dist/*.aab
            dist/*.apk
            release-notes/RELEASE_NOTES_APK.md
          body_path: release-notes/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ needs.changelog.outputs.has_breaking == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-play:
    name: Publish to Google Play
    needs: [build-aab, changelog]
    runs-on: ubuntu-latest
    # Conditions: tag v* OU dispatch manuel avec publish_play=true
    # Et le secret PLAY_SERVICE_ACCOUNT_JSON doit exister (vérifié au runtime)
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_play == true)
    environment: production
    steps:
      - name: Verify Play service account secret
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "❌ Secret PLAY_SERVICE_ACCOUNT_JSON manquant — étape Play ignorée."
            exit 1
          fi
          echo "✅ Service account présent."

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: release/

      - name: Download mapping (optional)
        uses: actions/download-artifact@v4
        with:
          name: proguard-mapping
          path: release/
        continue-on-error: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes/

      - name: Determine track and rollout
        id: track
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TRACK="production"
            RF="${{ inputs.rollout }}"
            [ -z "$RF" ] && RF="0.2"
            echo "track=$TRACK" >> $GITHUB_OUTPUT
            echo "status=inProgress" >> $GITHUB_OUTPUT
            echo "userFraction=$RF" >> $GITHUB_OUTPUT
          else
            TRACK="${{ inputs.track }}"
            [ -z "$TRACK" ] && TRACK="internal"
            if [ "$TRACK" = "production" ] && [ -n "${{ inputs.rollout }}" ]; then
              echo "track=$TRACK" >> $GITHUB_OUTPUT
              echo "status=inProgress" >> $GITHUB_OUTPUT
              echo "userFraction=${{ inputs.rollout }}" >> $GITHUB_OUTPUT
            else
              echo "track=$TRACK" >> $GITHUB_OUTPUT
              echo "status=completed" >> $GITHUB_OUTPUT
              echo "userFraction=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: release/*.aab
          mappingFile: release/mapping.txt
          track: ${{ steps.track.outputs.track }}
          status: ${{ steps.track.outputs.status }}
          userFraction: ${{ steps.track.outputs.userFraction }}
          inAppUpdatePriority: 3
          whatsNewDirectory: release-notes/whatsnew

